name: Frontend checks

on:
  push:
    branches: ['codex/frontend-stabilization', 'main-atharv']
    paths: ['Frontend/healthconnect-source/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['Frontend/healthconnect-source/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/healthconnect-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/healthconnect-source/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_DEMO_MODE: 'true'
